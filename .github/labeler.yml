# app:* IS THE DECLARATION. A change to shared/ marks every app, because
# shared/ is pinned by every app and CI/CD will redeploy all of them.
#
# Considered and rejected: a separate `shared` label with app:* derived
# transitively from it. It carried strictly more information -- you could tell
# a four-app change from a shared-surface change implying four apps -- and it
# was worse, because `shared` means nothing to someone reading their first PR
# here. `app:core app:plp app:pdp app:checkout` needs no glossary: it says CI
# is going to push all four. Declarative beats derivable.
#
# To touch shared/ WITHOUT redeploying everything, add labeler:skip and set the
# app:* labels by hand -- one, or none. That is the same escape hatch as every
# other derived label, and it is visible on the PR rather than implied by an
# absent marker.
app:core:
  - changed-files:
      - any-glob-to-any-file:
          - apps/core/**
          # shared/ is imported by every app, so a change there IS a change to
          # every app -- the manifest must say so. Before this, editing
          # shared/oneui.js produced a PR with no app:* label at all: the
          # highest-blast-radius change in the repo, declaring that it touched
          # nothing deployable. groups.sh then returned empty and the queue
          # refused it for the wrong reason.
          - shared/**
app:plp:
  - changed-files:
      - any-glob-to-any-file:
          - apps/plp/**
          # shared/ is imported by every app, so a change there IS a change to
          # every app -- the manifest must say so. Before this, editing
          # shared/oneui.js produced a PR with no app:* label at all: the
          # highest-blast-radius change in the repo, declaring that it touched
          # nothing deployable. groups.sh then returned empty and the queue
          # refused it for the wrong reason.
          - shared/**
app:pdp:
  - changed-files:
      - any-glob-to-any-file:
          - apps/pdp/**
          # shared/ is imported by every app, so a change there IS a change to
          # every app -- the manifest must say so. Before this, editing
          # shared/oneui.js produced a PR with no app:* label at all: the
          # highest-blast-radius change in the repo, declaring that it touched
          # nothing deployable. groups.sh then returned empty and the queue
          # refused it for the wrong reason.
          - shared/**
app:checkout:
  - changed-files:
      - any-glob-to-any-file:
          - apps/checkout/**
          # shared/ is imported by every app, so a change there IS a change to
          # every app -- the manifest must say so. Before this, editing
          # shared/oneui.js produced a PR with no app:* label at all: the
          # highest-blast-radius change in the repo, declaring that it touched
          # nothing deployable. groups.sh then returned empty and the queue
          # refused it for the wrong reason.
          - shared/**
# mock lives under external/, not apps/ -- external services are stubbed, not
# deployed by us. The glob still said apps/mock/** after the move, so this
# label had been unreachable: dead config that reads as coverage.
# It does NOT take shared/: mock is not ours to redeploy.
app:mock:
  - changed-files:
      - any-glob-to-any-file: external/mock/**
# THE VERIFICATION CONTROL PLANE. Narrower than itil:normal on purpose.
#
# itil:normal globs router/, gates/, change/, targets/ and .github/ -- but
# those are two different things:
#
#   router/, targets/   HOW A THING SHIPS. A deploy script change is verified
#                       the ordinary way: deploy it, observe the estate.
#   gates/, change/,    HOW EVERY CHANGE IS VERIFIED. These cannot be verified
#   .github/            by the pipeline, because they ARE the pipeline. A green
#                       run of a changed gate proves the gate can run. It does
#                       not prove it still catches what it caught before.
#
# The label exists to say WHY this change is handled differently, on the PR,
# where a reviewer sees it -- rather than leaving itil:normal to imply it.
# It is the trigger for the soak practice in research/findings/changing-the-pipeline.org:
# a pipeline change is proven by USE, across N subsequent deployments, not by
# its own merge. It is also why such a change must not auto-merge: it is not
# proven until later changes have shipped through it.
control-plane:
  - changed-files:
      - any-glob-to-any-file:
          - gates/**
          - change/**
          - .github/**

# itil:normal -- assessed before it moves.
#
# TWO REASONS A CHANGE LANDS HERE, and they are different:
#
#   the control plane   router/, gates/, change/, targets/, .github/ -- it
#                       changes how things ship, or how they are verified.
#   SCHEMA MIGRATIONS   db/migrate/, apps/*/migrations/ -- not obviously
#                       reversible, blast radius beyond the deploy, stateful
#                       and one-shot. A deploy rolls back by serving the
#                       previous build; a migration that dropped a column does
#                       not. See research/history/classification-frameworks.org.
#
# PRECEDENCE, because two globs can match one change: NORMAL WINS. A change
# containing a migration is a change containing a migration, whatever else it
# also contains. actions/labeler has no precedence of its own -- it adds every
# label whose glob matches -- so exclusivity is enforced downstream by the
# `exclusive class` row in change/label-owners.tsv and by
# gates/pr-state-audit.py I5, not here. That split is deliberate: this file
# DERIVES, the audit ADJUDICATES.
itil:normal:
  - changed-files:
      - any-glob-to-any-file:
          - router/**
          - gates/**
          - change/**
          - targets/**
          - .github/**
          - db/migrate/**
          - 'apps/*/migrations/**'
          - 'apps/*/db/**'

# ---------------------------------------------------------------------------
# THE OWNERSHIP BOUNDARY -- read before adding a label to this file.
#
# `sync-labels: true` means actions/labeler REMOVES a label whose globs stop
# matching. So appearing in this file is what "the labeller owns it" MEANS, and
# the boundary is drawn by absence:
#
#   in this file      the labeller owns it. It derives, and it takes back.
#   NOT in this file  somebody else owns it. The labeller cannot touch it.
#
# itil:emergency is NOT here, deliberately. It is human-owned
# (change/label-owners.tsv: human_add=yes, human_rm=yes). A person declares an
# emergency; a glob cannot, because "this change is the remedy for something
# already wrong" is a fact about the world and not about the diff.
#
# Adding an itil:emergency entry here -- even one that never matches -- hands
# it to a reconciler that will take it back the moment the globs miss. That is
# an override that can be overwritten, which is not an override; it is a race.
# The same shape as Kubernetes field ownership and Terraform's
# lifecycle{ignore_changes}: a derived value has a declared manager, a human
# may take it, and the derivation must then STOP RECONCILING rather than fight.
#
# OPTIONS, if this boundary needs to move -- stated so the next person picks
# rather than discovers:
#
#   A. Leave it. Enforced by absence. Cheapest, and invisible: nothing reports
#      a violation, so the protection is a convention a single edit defeats.
#      (current)
#   B. Gate it. A check that fails if any human_add=yes label from
#      label-owners.tsv appears in this file. Makes the boundary executable and
#      costs one gate. RECOMMENDED if this file grows.
#   C. Split the file. Derived labels here, human labels in a registry the
#      action never reads. Strongest, and the most churn.
#   D. Drop sync-labels. The labeller adds and never removes; stale derived
#      labels then accumulate and nothing owns clearing them. Rejected -- it
#      trades a boundary problem for a staleness problem, and we have measured
#      the staleness one.
# ---------------------------------------------------------------------------

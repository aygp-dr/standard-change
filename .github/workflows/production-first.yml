name: production-first
# A change that deploys must reach PRODUCTION before it reaches main.
#
# Runs as a CHECK so it is visible on the PR and can be made a required status
# check by a ruleset. Until now the ordering was a convention: merge-on-healthy
# TRIGGERS on production:healthy, and a trigger is not a gate -- `gh pr merge`
# walks past it. #12, a security fix, merged on staging alone and left main
# claiming an XSS was fixed while every production replica served the
# vulnerable build.
#
# IT DOES NOT RE-RUN ON A LABEL, AND THE TYPES LIST BELOW IS NOT WHY IT MIGHT.
#
# This comment used to say the check "re-runs on `labeled` and `unlabeled` so it
# goes green the moment gates/health.sh records production:healthy, without
# needing a push". That was asserted, never measured, and it is false. Of 484
# runs of this workflow, not one came from a label. `actions/labeler` writes
# with GITHUB_TOKEN and an event produced by GITHUB_TOKEN does not start another
# workflow run -- GitHub's loop prevention, working as designed. The labeller
# can never wake the gate that reads its labels (issue #29).
#
# The types stay because a HUMAN's label -- adding production:healthy by hand,
# or withdrawing an app:* -- does trigger a run, and that is worth reacting to.
# What changed is that the gate no longer DEPENDS on being woken: it derives the
# deployable surface from the diff, so its verdict on `opened` is already the
# right one. See gates/production-first.sh.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
permissions: {contents: read, pull-requests: read}
jobs:
  production-first:
    runs-on: ubuntu-latest
    env: {GH_TOKEN: "${{ github.token }}", PR: "${{ github.event.pull_request.number }}"}
    steps:
      - uses: actions/checkout@v4
      - run: ./gates/production-first.sh "$PR"

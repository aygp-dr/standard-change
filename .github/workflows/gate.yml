name: gate
on:
  pull_request:
    # NO `labeled`. The gates measure the HEAD SHA, and a label does not change
    # the head SHA -- so a label-triggered run re-measures the identical build
    # and can only return the same verdict, unless the gates are
    # non-deterministic, in which case re-running is actively harmful: it can
    # flip green to red on a build nobody touched.
    #
    # It was not free. change/uat.sh writes three labels (staging:e2e,
    # staging:smoke, staging:uat), each of which re-ran this whole suite, and
    # guard 4 requires green check runs -- so RECORDING THE OBSERVATION VOIDED
    # THE AUTHORIZATION THAT OBSERVATION WAS TAKEN FOR, until CI caught up.
    # Measured on #69: 33 seconds of a 2m26s cycle, 23% of it, spent waiting
    # for a rerun of a verdict we already had.
    #
    # This is also the read-after-write race in spec.org defect class 8: it is
    # what made guard 4 refuse #57 one minute before reading it as authorized.
    types: [opened, synchronize, reopened]
permissions: {contents: read}

jobs:
  # Runs FIRST and gates the rest: a suite whose self-test did not pass
  # produces no usable verdict (spec.org, Verification contract).
  gate-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.11'}
      - run: pip install --quiet hypothesis
      - run: ./gates/docs-lint.py
      - run: ./gates/docs-lint.py --selftest
      - run: ./gates/labeller-test.py
      - run: $(command -v gmake make | head -1) -s audit-selftest
      - run: ./gates/simulate-gates.py --check
      - run: ./gates/pbt-pipeline.py --exhaustive
      - name: the model must still be able to fail
        run: |
          if GUARD_4B=0 ./gates/pbt-pipeline.py --exhaustive >/dev/null; then
            echo "::error::the model cannot reach scenario D4; it verifies nothing"; exit 1
          fi

  lint:
    needs: gate-selftest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: '22'}
      - run: ./router/generate.sh
      - run: for a in apps/*/; do node --check "$a/src/server.js"; jq -e . "$a/routes.json" >/dev/null; done
      - name: routes.json must be the source of the router
        run: git diff --exit-code router/routes.json || { echo "::error::router/routes.json is stale; regenerate it"; exit 1; }

  test:
    needs: gate-selftest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: '22'}
      - run: for a in apps/*/; do (cd "$a" && node --test); done

  e2e:
    needs: gate-selftest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: '22'}
      - name: bring up a block in the runner
        run: |
          ./router/generate.sh
          # A fresh registry: the committed ports.tsv claims block 0 for a
          # developer's path, so alloc would hand this runner block 1 and the
          # router would not be where the next step looked.
          echo "PORTS_REGISTRY=$RUNNER_TEMP/ports.tsv" >> "$GITHUB_ENV"
          PORTS_REGISTRY=$RUNNER_TEMP/ports.tsv ./change/ports.sh alloc
          PORTS_REGISTRY=$RUNNER_TEMP/ports.tsv ./change/ports.sh run-apps
          sleep 4
      - name: journeys through the router
        run: |
          . ./.env.ports
          echo "router on $BASE_PORT"
          ROUTER_URL="http://127.0.0.1:$BASE_PORT" ./gates/e2e.sh

      # THE CONTRACT GATE, for both environment shapes.
      #
      # Runs the same suite twice, once with each environment's values, against
      # the runner's own ephemeral block. It answers "would this build satisfy
      # the staging contract, and the production contract" -- which is worth
      # gating on, and is NOT the same question as "is production serving it".
      #
      # DELIBERATELY NO `--pr`. With it, e2e.sh writes an observation record and
      # a staging:e2e / production:e2e label. A record from here would name an
      # estate that lives for ninety seconds inside a runner, and guard 4 would
      # read it as authorization to reach the real production. gates/e2e.sh
      # already carries the comment about this exact defect: "Hardcoding
      # 'staging' made a run against the PRODUCTION front record staging:e2e".
      #
      # So this GATES (a red run blocks the PR) and OBSERVES NOTHING. The
      # authorizing observation still has to be taken on an estate that exists.
      - name: contract gate -- staging and production shapes
        run: |
          . ./.env.ports
          rc=0
          for env in staging production; do
            echo "== contract: $env"
            CHANGE_ENV="$env" ROUTER_URL="http://127.0.0.1:$BASE_PORT" \
              ./gates/e2e.sh || rc=1
          done
          [ "$rc" = 0 ] || { echo "::error::a contract gate failed"; exit 1; }
          echo "both contracts satisfied on the ephemeral block "\
               "(this is not an observation of any real environment)"
      - if: always()
        run: PORTS_REGISTRY=$RUNNER_TEMP/ports.tsv ./change/ports.sh stop || true

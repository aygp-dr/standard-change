name: merge-on-healthy
on:
  pull_request:
    types: [labeled]
permissions: {contents: write, pull-requests: write}
jobs:
  merge:
    if: github.event.label.name == 'production:healthy'
    runs-on: ubuntu-latest
    env: {GH_TOKEN: "${{ github.token }}", PR: "${{ github.event.pull_request.number }}"}
    steps:
      - uses: actions/checkout@v4
      # Guard 4b at the merge, AGAIN. production:healthy says the estate is
      # serving this change; it says nothing about whether main has moved
      # since. If it has, merging now would land a tree that predates what is
      # already on main -- and production is ALREADY serving it.
      - name: main must not have outrun production
        run: |
          state=$(gh pr view "$PR" --json mergeStateStatus -q .mergeStateStatus)
          case "$state" in
            BEHIND|DIRTY)
              gh pr comment "$PR" --body "PRODUCTION IS AHEAD OF MAIN. \`production:healthy\` is set and the estate is serving this change, but \`main\` moved during the deploy (\`$state\`) so the merge is refused. This is not recoverable by merging -- see spec.org, the divergence below."
              gh pr edit "$PR" --add-label blocked:diverged
              exit 9 ;;
          esac
      # Re-derive the fact the label asserts. GitHub cannot distinguish a label
      # written by a gate from one typed by a person, so trusting
      # production:healthy would make hand-adding it a way to merge with no
      # deployment at all.
      # UNREACHABLE IS NOT FALSIFIED. This step used to withdraw
      # production:healthy whenever health.sh exited non-zero -- including when
      # it exited non-zero because it could not open a socket at all. On PR #9
      # that withdrew the label four times in nine minutes: the runner is
      # ubuntu-latest, production is on hydra's 192.168.86.0/24, and no runner
      # can reach any environment in this repository. It recorded "I could not
      # look" as "it is not there", and rewrote a measurement somebody else took.
      #
      # Reachability is now decided FIRST and separately from the verdict:
      #   reachable + healthy    -> proceed
      #   reachable + unhealthy  -> withdraw the label; it is genuinely false
      #   unreachable            -> ABSTAIN: refuse the merge, touch nothing
      #
      # Abstaining still fails closed, which is right. What it must not do is
      # falsify. See docs/label-ownership.org, rule 2.
      - name: guard 5, again — do not trust the label that triggered this
        run: |
          SHA=$(gh pr view "$PR" --json headRefOid -q .headRefOid | cut -c1-7)
          URL="${{ vars.PRODUCTION_URL }}"
          if [ -z "$URL" ] || ! curl -sS -o /dev/null --max-time 10 "$URL/" 2>/dev/null; then
            gh pr comment "$PR" --body "**Merge refused — guard 5 could not be re-derived.** \`${URL:-PRODUCTION_URL unset}\` is not reachable from an \`ubuntu-latest\` runner, so this workflow cannot check whether production is serving \`$SHA\`. \`production:healthy\` has been **left alone**: it was written by \`gates/health.sh\` running where production is visible, and this workflow has no standing to withdraw a measurement it could not take — being unable to look is not the same as looking and finding nothing. Settle from a host that can see the estate: \`./change/settle.sh $PR\`."
            exit 1
          fi
          HEALTH_MODE=manifest HEALTH_SAMPLES=5 ./gates/health.sh "$URL" "$SHA" \
            || { gh pr edit "$PR" --remove-label production:healthy
                 gh pr comment "$PR" --body "production:healthy was set, production is reachable, and it is NOT serving \`$SHA\`. The label has been withdrawn -- this is a real negative observation, not an unreachable one -- and the merge refused."
                 exit 1; }
      - run: ./change/release.sh "$PR"

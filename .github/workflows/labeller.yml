name: labeller
on: [pull_request_target]
permissions: {contents: read, pull-requests: write}
jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        # labeler:skip hands the manifest back to a human -- for forcing a build
        # across apps the diff does not touch. See the note below: this converts
        # a DERIVED artifact into an ASSERTED one, and the PR wears the label
        # saying so.
        if: "!contains(github.event.pull_request.labels.*.name, 'labeler:skip')"
        with:
          sync-labels: true          # the labeller OWNS app:* and change:{standard,normal}
      # change:standard is the COMPLEMENT of change:normal, which actions/labeler
      # cannot express -- it matches globs, it cannot say "matched no other rule".
      # The offline oracle modelled this as derived and the config never
      # implemented it, so PRs got app:* and no change:* at all. Third time the
      # model and the implementation have diverged; the implementation was wrong
      # here, and only a live run showed it.
      - name: classify standard vs normal
        if: "!contains(github.event.pull_request.labels.*.name, 'labeler:skip')"
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          # Derive from the DIFF, not from the labels actions/labeler just
          # wrote. Reading them back in the same job races the API: the first
          # version computed has_app from `gh pr view` and saw zero, so it
          # applied nothing and exited 0 -- a silent no-op that looked like a
          # policy decision.
          R=${{ github.repository }}
          N=${{ github.event.number }}
          files=$(gh pr diff "$N" --repo "$R" --name-only)
          # DEPLOYABLE SURFACE, not just apps/. shared/ is pinned by every app
          # and external/ carries app:mock, so a change to either is a change to
          # something deployable and must be classified. Grepping only ^apps/
          # left a shared/ change with five app:* labels and NO change:* class
          # at all -- unclassified, and therefore matching no guard's idea of
          # what it was looking at.
          has_app=$(echo "$files" | grep -cE '^(apps|shared|external)/' || true)
          is_normal=$(echo "$files" | grep -cE '^(router|gates|change|targets)/|^\.github/' || true)
          echo "changed=$(echo "$files" | wc -l) apps=$has_app normal=$is_normal"
          if [ "$is_normal" -gt 0 ]; then
            gh pr edit "$N" --repo "$R" --add-label change:normal || true
            gh pr edit "$N" --repo "$R" --remove-label change:standard || true
          elif [ "$has_app" -gt 0 ]; then
            gh pr edit "$N" --repo "$R" --add-label change:standard || true
            gh pr edit "$N" --repo "$R" --remove-label change:normal || true
          fi

      # Every observation is about a BUILD. The labels do not carry the SHA they
      # were taken at, so a push must withdraw all of them -- otherwise a
      # staging:uat recorded by a person who looked at the old build goes on
      # authorizing the new one through guard 4, and nobody has looked at what
      # is shipping. Same law as guard 4b: a guard whose subject can change
      # after it is checked must be re-checked at the moment it is relied on.
      #
      # staging:uat is included deliberately. A human observation is not more
      # durable than a machine one -- it is about a build in exactly the same
      # way, and a person who accepted 7cd3281 has said nothing about 8370c74.
      #
      # THIS STEP IS NO LONGER LOAD-BEARING, AND THAT IS THE POINT. Guard 4 and
      # gates/production-first.sh used to be sound only while this step kept
      # firing; on #11 it did not, and observations taken on 9d85a33 went on
      # authorizing baed821 (issue #16). They now authorize from the
      # observation RECORD, a PR comment naming the SHA that was measured,
      # which cannot go stale because it never claimed to be about anything but
      # the build it names. What remains here is tidying: the labels are the
      # CURRENT-RUN signal, and after a push no run is in flight.
      #
      # Three things were wrong with the previous version:
      #
      #   1. no --repo. `gh pr edit` outside a checkout has no repository to
      #      resolve, and this job never checks out. That alone can make every
      #      removal fail.
      #   2. `|| true` on each removal. "I could not withdraw a stale verdict"
      #      reported as success -- the same defect as merge-on-healthy
      #      recording unreachable-as-false.
      #   3. production:* was never in the list at all, while
      #      production-first.sh's comment asserted this step withdrew
      #      production:healthy on every push. It did not.
      #
      # Removing a label that is not present is an error from `gh` and is not a
      # failure of ours, so presence is checked first and anything left is a
      # real failure that fails the step.
      - name: withdraw every staging observation on a new push
        if: github.event.action == 'synchronize'
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          set -u
          R=${{ github.repository }}
          N=${{ github.event.number }}
          have=$(gh pr view "$N" --repo "$R" --json labels -q '[.labels[].name]|join(" ")')
          rc=0
          for l in staging:passed staging:failed staging:e2e staging:e2e-failed \
                   staging:smoke staging:smoke-failed staging:uat \
                   staging:in-progress \
                   production:healthy production:e2e production:e2e-failed \
                   production:smoke production:smoke-failed; do
            case " $have " in *" $l "*) ;; *) continue ;; esac
            if gh pr edit "$N" --repo "$R" --remove-label "$l"; then
              echo "withdrew $l -- it describes a build that is no longer the head"
            else
              echo "::error::could not withdraw $l from #$N. A stale observation is still on this PR."
              rc=1
            fi
          done
          [ "$rc" = 0 ] || echo "::error::stale observations remain; guard 4 reads the observation records, not these labels, so this does not authorize anything -- but the PR now says something untrue."
          exit $rc

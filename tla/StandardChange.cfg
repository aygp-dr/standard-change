SPECIFICATION Spec
CONSTANTS
    PRs = {p1, p2}
    Operators = {o1, o2}
    MaxMerges = 2
    NoPR = NoPR
    NoOp = NoOp
    Guard4b = TRUE          \* flip to FALSE to reproduce the D4 counterexample
    ProdFirst = TRUE        \* flip to FALSE to reproduce the PR #12 counterexample
    LockOwned = TRUE        \* flip to FALSE to reproduce D21: a swept lock
\* NAMED SEPARATELY, not folded into Safety. The L7 review found that
\* check.sh grepped the identical string for two different negative runs,
\* so either could pass for the other. Each invariant TLC can violate
\* independently gets its own line and its own name in the output.
INVARIANT Safety
INVARIANT NoSweptLock

CHECK_DEADLOCK FALSE

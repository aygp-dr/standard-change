\* THE POSITIVE RUN. Every constant is set to the rule that makes Safety hold,
\* so every FALSE below names a defect this repository actually has -- see
\* docs/label-state-machine.org. tla/check.sh flips each one in turn and
\* requires the named invariant to be violated; a constant whose negative run
\* still passes is a constant that verifies nothing.
SPECIFICATION Spec
CONSTANTS
    PRs = {p1, p2}
    MaxMerges = 2
    SeparateEmergency   = TRUE  \* FALSE = the repo today -> DeclaringABlockDoesNotExempt
    ClassExclusive      = TRUE  \* FALSE = the repo today -> ClassAtMostOne (#2)
    ClassRequired       = TRUE  \* FALSE = the repo today -> ClassifiedBeforeDeploy
    LifecycleReplaces   = TRUE  \* FALSE = the repo today -> LifecycleAtMostOneActive
    Soak                = TRUE  \* FALSE = the repo today -> ControlPlaneSoaks
    ClassConflictRefused = TRUE \* preflight's refusal -> NoUndefinedClassMoves
    BerthMutex          = TRUE  \* guard 1, present at two sites
    EstateBlocks        = TRUE  \* ADR 0001 S8 -> OrdinaryChangeWaits
    EmergencyPreempts   = TRUE  \* FALSE = the repo today -> EmergencyNeverWaits
INVARIANT Safety
CHECK_DEADLOCK FALSE

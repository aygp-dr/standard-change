# Vale for the research writeup. Styles copied from jwalsh/www.wal.sh on
# 2026-09-15 (WalSh: EmDash, ContrastivePivot, LoadBearing, LLMSpeak,
# ThesisInflation) plus that repo's TechWriting vocabulary as the base of
# StandardChange/accept.txt. `gmake prose` runs it over research/.
StylesPath = .vale/styles
MinAlertLevel = suggestion
Vocab = StandardChange
[formats]
org = md
[*.org]
BasedOnStyles = Vale, WalSh
BlockIgnores = (?si)(#\+begin_src.*?#\+end_src), (?si)(#\+begin_example.*?#\+end_example), (?si)(:properties:.*?:end:), (?si)(#\+begin_comment.*?#\+end_comment)
TokenIgnores = (~[^~]+~), (=[^=]+=), (https?://\S+), (file:\S+), (#\+[A-Z_]+:.*), (\[cite:[^\]]+\]), (\[\[[^\]]*\]\[[^\]]*\]\])
